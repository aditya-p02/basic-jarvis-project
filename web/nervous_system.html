<!DOCTYPE html>
<html>
<head>
<style>
    body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        overflow: hidden; background: transparent; 
        font-family: 'Consolas', monospace; color: white;
        user-select: none;
    }
    #ui-layer {
        position: absolute;
        bottom: 40px;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
        text-shadow: 0px 2px 12px rgba(0,0,0,0.9);
    }
    #status-bar {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 3px;
        margin-bottom: 6px;
        transition: color 0.4s ease;
    }
    #action-bar {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.75);
        min-height: 20px;
        font-weight: bold;
    }
    canvas { 
        display: block; 
        position: absolute;
        top: 0; left: 0;
        z-index: -1;
    }
</style>
</head>
<body>

<canvas id="neuralCanvas"></canvas>

<div id="ui-layer">
    <div id="status-bar">STANDBY</div>
    <div id="action-bar"></div>
</div>

<script>
    const canvas = document.getElementById('neuralCanvas');
    const ctx = canvas.getContext('2d');
    
    // Setup canvas dimension
    const size = 600;
    canvas.width = size;
    canvas.height = size;

    let themeColor = "0, 200, 255"; 
    let speedMultiplier = 1.0;
    let agitation = 0;

    window.setJarvisState = function(state) {
        const statusBar = document.getElementById('status-bar');
        statusBar.textContent = state;
        
        if (state === 'LISTENING') {
            themeColor = "0, 255, 200"; 
            speedMultiplier = 1.5;
            agitation = 0.2;
            statusBar.style.color = `rgb(${themeColor})`;
        } else if (state === 'THINKING') {
            themeColor = "180, 70, 255"; 
            speedMultiplier = 3.5;
            agitation = 0.5;
            statusBar.style.color = `rgb(${themeColor})`;
        } else if (state === 'EXECUTING') {
            themeColor = "255, 130, 0"; 
            speedMultiplier = 4.0;
            agitation = 2.5; 
            statusBar.style.color = `rgb(${themeColor})`;
        } else if (state === 'RESPONDING') {
            themeColor = "0, 130, 255"; 
            speedMultiplier = 2.0;
            agitation = 0.8;
            statusBar.style.color = `rgb(${themeColor})`;
        } else if (state === 'ERROR') {
            themeColor = "255, 60, 60"; 
            speedMultiplier = 1.0;
            statusBar.style.color = `rgb(${themeColor})`;
        } else {
            themeColor = "0, 160, 220"; 
            speedMultiplier = 0.8;
            agitation = 0;
            statusBar.style.color = "white";
        }
    };

    // --- True 3D Engine Math ---
    let particles = [];
    const numParticles = 75;
    const focalLength = 300; 
    let angleY = 0.005; 
    let angleX = 0.003;

    class Neuron3D {
        constructor() {
            // Spherical distribution for organic structural shape
            let u = Math.random();
            let v = Math.random();
            let theta = u * 2.0 * Math.PI;
            let phi = Math.acos(2.0 * v - 1.0);
            let r = Math.random() * 50 + 130; // Radius cluster bounds

            this.x = r * Math.sin(phi) * Math.cos(theta);
            this.y = r * Math.sin(phi) * Math.sin(theta);
            this.z = r * Math.cos(phi);

            // Autonomous organic drift inside the system
            this.vx = (Math.random() - 0.5) * 1.0;
            this.vy = (Math.random() - 0.5) * 1.0;
            this.vz = (Math.random() - 0.5) * 1.0;

            this.pulsePhase = Math.random() * Math.PI * 2;
        }

        update() {
            let actualSpeed = speedMultiplier;
            let jitter = (Math.random() - 0.5) * agitation;

            this.x += (this.vx * actualSpeed) + jitter;
            this.y += (this.vy * actualSpeed) + jitter;
            this.z += (this.vz * actualSpeed) + jitter;

            // Contain nodes within an organic 3D sphere radius
            let currentDist = Math.sqrt(this.x*this.x + this.y*this.y + this.z*this.z);
            if (currentDist > 190) {
                this.vx *= -1; this.vy *= -1; this.vz *= -1;
            }

            this.pulsePhase += 0.04 * actualSpeed;

            
            // Y-Axis Rotation
            let cosY = Math.cos(angleY * actualSpeed);
            let sinY = Math.sin(angleY * actualSpeed);
            let x1 = this.x * cosY - this.z * sinY;
            let z1 = this.z * cosY + this.x * sinY;

            // X-Axis Rotation
            let cosX = Math.cos(angleX * actualSpeed);
            let sinX = Math.sin(angleX * actualSpeed);
            this.y = this.y * cosX - z1 * sinX;
            this.z = z1 * cosX + this.y * sinX;
            this.x = x1;
        }

        getProjectedCoords() {
            // Calculate scale based on Z depth position
            let scale = focalLength / (focalLength + this.z);
            return {
                x: (this.x * scale) + (size / 2),
                y: (this.y * scale) + (size / 2),
                scale: scale,
                z: this.z
            };
        }
    }

    for (let i = 0; i < numParticles; i++) particles.push(new Neuron3D());

    function animate() {
        ctx.clearRect(0, 0, size, size);
        
        // Compute current frames mapping projections
        let projected = particles.map(p => {
            p.update();
            return { proj: p.getProjectedCoords(), orig: p };
        });

        // Depth sorting (Z-indexing) so background strings render underneath foreground strings
        projected.sort((a, b) => b.proj.z - a.proj.z);

        // Render synapses connections
        for (let i = 0; i < projected.length; i++) {
            for (let j = i + 1; j < projected.length; j++) {
                let p1 = projected[i];
                let p2 = projected[j];

                let dx = p1.orig.x - p2.orig.x;
                let dy = p1.orig.y - p2.orig.y;
                let dz = p1.orig.z - p2.orig.z;
                let realDist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                if (realDist < 110) {
                    ctx.beginPath();
                    ctx.moveTo(p1.proj.x, p1.proj.y);
                    ctx.lineTo(p2.proj.x, p2.proj.y);
                    
                    let proximityAlpha = 1 - (realDist / 110);
                    // Base alpha determined by the foreground depth scaling calculation
                    let depthAlpha = (p1.proj.scale + p2.proj.scale) / 2; 

                    ctx.strokeStyle = `rgba(${themeColor}, ${proximityAlpha * depthAlpha * 0.6})`;
                    
                    // Dynamic line thickness based directly on proximity perspective
                    ctx.lineWidth = Math.max(0.5, (p1.proj.scale + p2.proj.scale) * 1.3);
                    ctx.stroke();
                }
            }
        }

        // Render individual Bio-Neurons
        projected.forEach(p => {
            let pulse = 0.5 + 0.5 * Math.abs(Math.sin(p.orig.pulsePhase));
            ctx.beginPath();
            ctx.arc(p.proj.x, p.proj.y, Math.max(1, p.proj.scale * 3.5), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${themeColor}, ${pulse})`;
            ctx.shadowBlur = 12 * p.proj.scale;
            ctx.shadowColor = `rgba(${themeColor}, 1)`;
            ctx.fill();
        });

        requestAnimationFrame(animate);
    }
    
    // Set default initial state loop colors
    window.setJarvisState('STANDBY');
    animate();
</script>
</body>
</html>
